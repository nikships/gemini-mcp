[project]
name = "aio-gemini-mcp"
version = "0.1.2"
description = "A stdio FastMCP server for Google's Gemini API"
readme = "README.md"
authors = [
    { name = "factory-droid[bot]", email = "138933559+factory-droid[bot]@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "google-genai>=2.28.0,<3",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
aio-gemini-mcp = "aio_gemini:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv.build-backend]
module-name = "aio_gemini"
